# Spec §11: one origin for the browser; the API is reached through this server.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://api:3000;
    }

    # Client-side routes such as /receiving/:id.
    location / {
        try_files $uri /index.html;
    }
}
